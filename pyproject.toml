[project]
name = "helpdesk-api"
version = "0.1.0"
description = "API de help desk: tickets, SLA, notificações em tempo real e RBAC"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.31",
    "fastapi[standard]>=0.141",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[tool.uv]
# É uma aplicação, não uma biblioteca: não precisa ser empacotada.
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # ordem dos imports
    "UP",      # sintaxe moderna do Python
    "B",       # bugbear: bugs comuns
    "SIM",     # simplificações
    "ASYNC",   # erros comuns em código async
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
